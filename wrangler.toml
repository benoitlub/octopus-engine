# Deployed via .github/workflows/deploy-worker.yml on push to main.
# Cloudflare secrets now added to this repo (were on poulpe-fiction's
# instead — repo secrets never share across repos).
# Name matches the Worker resource already created on Cloudflare
# (octopus-engine-app) — confirmed with the user, the API token scope
# expects this exact name.
name = "octopus-engine-app"
main = "src/worker.ts"
compatibility_date = "2024-11-01"

[vars]
MISTRAL_MODEL = "ministral-8b-2512"
EXECUTION_ADAPTER_ID = "publisher"
EXECUTION_ADAPTER_URL = "https://blacklace-publisher-worker.benoitlubert.workers.dev/api/octopus-adapter/execute"
EXECUTION_ADAPTER_CAPABILITIES = "content.generate,copy.generate,content.article.write,content.social.write,knowledge.search,tool.search,business.sources.search,tool.execute,social.publish"

[[services]]
binding = "EXECUTION_ADAPTER"
service = "blacklace-publisher-worker"

[durable_objects]
bindings = [
  { name = "FEUCH_ROOMS", class_name = "FeuchRoom" }
]

[[migrations]]
tag = "feuch-link-v1"
new_sqlite_classes = ["FeuchRoom"]
