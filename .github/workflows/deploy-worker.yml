name: Deploy Octopus Worker

# Purely infrastructural: makes the existing Cloudflare-Worker-compatible
# entry point (src/worker.ts, wrangler.toml — both already present, unused
# until now) actually reachable. Touches no application logic, no
# capabilities, no policy — Octopus's neutral-core code is untouched by
# this workflow. Mirrors blacklace-publisher-ai's deploy-publisher-worker.yml
# (same account, same deploy mechanics), minus a workingDirectory since this
# repo's wrangler.toml lives at the root rather than in a subfolder.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.119.0"
