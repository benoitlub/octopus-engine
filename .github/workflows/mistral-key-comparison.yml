name: Diagnose credential format and Cloudflare bindings
on:
  push:
    branches: [diagnostic/mistral-key-comparison-20261126]
    paths: [.github/workflows/mistral-key-comparison.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read non-secret diagnostics
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const raw=process.env.MISTRAL_API_KEY||'';
          const key=raw.trim();
          const labels=k=>k.endsWith('x9P2')?'octo':k.endsWith('4izP')?'Pulpito':'unidentified';
          const candidates=[key.replace(/^Bearer\s+/i,''),key.replace(/^["']|["']$/g,'')];
          if(/^[A-Za-z0-9+/]+=*$/.test(key)&&key.length%4===0) candidates.push(Buffer.from(key,'base64').toString('utf8'));
          try {const data=JSON.parse(key);if(typeof data==='string')candidates.push(data);else if(data&&typeof data==='object')for(const name of ['api_key','apiKey','MISTRAL_API_KEY','key'])if(typeof data[name]==='string')candidates.push(data[name]);}catch{}
          console.log(JSON.stringify({type:'credential-format',length:key.length,outerWhitespace:raw!==key,internalWhitespace:/\s/.test(key),quoted:/^["']/.test(key),namedCandidate:candidates.map(labels).find(x=>x!=='unidentified')||null}));
          if(key){
            const response=await fetch('https://api.mistral.ai/v1/models',{headers:{Authorization:'Bearer '+key},signal:AbortSignal.timeout(20000)});
            const data=await response.json().catch(()=>({}));
            console.log(JSON.stringify({type:'mistral-authentication',httpStatus:response.status,availableModelCount:Array.isArray(data.data)?data.data.length:undefined,code:data.code}));
          }
          const token=process.env.CLOUDFLARE_API_TOKEN||'';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID||'';
          console.log(JSON.stringify({type:'cloudflare-credentials',tokenPresent:!!token,accountPresent:!!account}));
          if(token&&account){
            for(const worker of ['octopus-engine-app','blacklace-publisher-worker']){
              const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+worker+'/settings',{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
              const data=await response.json().catch(()=>({}));
              console.log(JSON.stringify({type:'worker-bindings',worker,httpStatus:response.status,success:data.success,errorCodes:data.errors?.map(e=>e.code),bindings:data.result?.bindings?.filter(b=>/MISTRAL|AI_API|OCTOPUS/i.test(b.name||'')).map(b=>({name:b.name,type:b.type,store_id:b.store_id,secret_name:b.secret_name,service:b.service}))}));
            }
          }
          JS
