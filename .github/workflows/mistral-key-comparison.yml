name: Validate bounded harvest source reads
on:
  push:
    branches: [diagnostic/mistral-key-comparison-20261126]
    paths: [.github/workflows/mistral-key-comparison.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: benoitlub/blacklace-publisher-ai
          ref: 95e067f200724e3011c6012d4a6a94aed126ac16
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated Worker dependencies
        run: npm --prefix publisher-worker install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Typecheck Worker
        run: npm --prefix publisher-worker run typecheck
      - name: Test Worker
        run: npm --prefix publisher-worker test
