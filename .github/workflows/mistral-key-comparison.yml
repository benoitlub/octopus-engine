name: Verify restored autonomous harvest loop
on:
  push:
    branches: [diagnostic/mistral-key-comparison-20261126]
    paths: [.github/workflows/mistral-key-comparison.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify deployed schedule and one bounded owner-requested cycle
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const token=process.env.CLOUDFLARE_API_TOKEN||'',account=process.env.CLOUDFLARE_ACCOUNT_ID||'';
          if(!token||!account) throw new Error('Cloudflare credentials unavailable');
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/blacklace-publisher-worker/schedules',{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
          const data=await response.json().catch(()=>({}));
          const schedules=data.result?.schedules||[];
          console.log(JSON.stringify({type:'autonomous-harvest-schedules',httpStatus:response.status,success:data.success,schedules:schedules.map(x=>({cron:x.cron}))}));
          if(!response.ok||!schedules.some(x=>x.cron==='*/15 * * * *')) throw new Error('Expected harvest schedule is not active');
          const cycle=await fetch('https://blacklace-publisher-worker.benoitlubert.workers.dev/api/tentacles/run-cycle?limit=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:'owner-restart-verification'}),signal:AbortSignal.timeout(65000)});
          const result=await cycle.json().catch(()=>({}));
          console.log(JSON.stringify({type:'one-autonomous-cycle',httpStatus:cycle.status,status:result.status,processed:result.processed,results:result.results?.map(x=>({seedId:x.seedId,mode:x.mode,status:String(x.status||'').slice(0,500)}))}));
          JS
