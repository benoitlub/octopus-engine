name: Read Mistral account diagnostic capabilities
on:
  push:
    branches: [diagnostic/mistral-key-comparison-20261126]
    paths: [.github/workflows/mistral-key-comparison.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - name: Discover official read-only account and billing diagnostic tools
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const key=(process.env.MISTRAL_API_KEY||'').trim();
          if(!key) throw new Error('Mistral key missing');
          const response=await fetch('https://api.mistral.ai/mcp',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json',Accept:'application/json, text/event-stream'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'tools/list',params:{}}),signal:AbortSignal.timeout(30000)});
          const raw=await response.text();
          let messages=[];
          try {messages=[JSON.parse(raw)];} catch {messages=raw.split('\n').filter(x=>x.startsWith('data:')).map(x=>{try{return JSON.parse(x.slice(5).trim());}catch{return null;}}).filter(Boolean);}
          const catalog=messages.flatMap(x=>x.result?.tools||[]);
          console.log(JSON.stringify({httpStatus:response.status,toolCount:catalog.length,errors:messages.map(x=>x.error).filter(Boolean),tools:catalog.filter(x=>/billing|budget|subscription|identity|whoami|current.user|organization|workspace/i.test(x.name+' '+x.description)).slice(0,20).map(x=>({name:x.name,description:x.description,inputSchema:x.inputSchema}))}));
          JS
