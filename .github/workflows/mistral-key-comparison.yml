name: Read actual autonomous harvest schedule
on:
  push:
    branches: [diagnostic/mistral-key-comparison-20261126]
    paths: [.github/workflows/mistral-key-comparison.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read schedule and latest server iteration metadata only
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const token=process.env.CLOUDFLARE_API_TOKEN||'',account=process.env.CLOUDFLARE_ACCOUNT_ID||'';
          if(!token||!account) throw new Error('Cloudflare credentials unavailable');
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/blacklace-publisher-worker/schedules',{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
          const data=await response.json().catch(()=>({}));
          console.log(JSON.stringify({type:'autonomous-harvest-schedules',httpStatus:response.status,success:data.success,schedules:data.result?.schedules?.map(x=>({cron:x.cron})),errorCodes:data.errors?.map(x=>x.code)}));
          const latest=await fetch('https://blacklace-publisher-worker.benoitlubert.workers.dev/api/tentacles/iterations?limit=1',{signal:AbortSignal.timeout(20000)});
          const payload=await latest.json().catch(()=>({}));
          console.log(JSON.stringify({type:'latest-server-iteration',httpStatus:latest.status,configured:payload.configured,rows:payload.iterations?.map(x=>({createdAt:x.created_at,seedId:x.seed_id,number:x.iteration_number,mode:x.mode,hasText:typeof x.content==='string'&&!!x.content.trim(),hasVisual:!!x.visual_url}))}));
          JS
